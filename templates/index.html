<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pills">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f1117">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <title>Pill Tracker</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1><span class="logo">&#128138;</span> Pill Tracker</h1>
      <div class="header-date" id="header-date"></div>
    </header>

    <main id="main-content">
      <!-- Today View -->
      <section id="view-today" class="view active">
        <div id="today-summary" class="summary-card"></div>
        <div id="today-next" class="next-up"></div>
        <div id="today-list"></div>
      </section>

      <!-- History View -->
      <section id="view-history" class="view">
        <div class="section-header"><h2>Last 7 Days</h2></div>
        <div id="history-grid"></div>
        <div class="section-header"><h2>Recent Activity</h2></div>
        <div id="history-activity"></div>
      </section>

      <!-- Manage View -->
      <section id="view-manage" class="view">
        <div class="section-header">
          <h2>Medications</h2>
          <button class="btn btn-primary btn-sm" id="btn-add-med">+ Add</button>
        </div>
        <div id="manage-list"></div>

        <div class="section-header" style="margin-top:24px;">
          <h2>Data</h2>
          <button class="btn btn-ghost btn-sm" id="btn-backup">Backup</button>
        </div>
        <div id="backup-list"></div>
      </section>
    </main>

    <nav class="tab-bar">
      <button class="tab-btn active" data-view="view-today">
        <span class="tab-icon">&#9200;</span><span>Today</span>
      </button>
      <button class="tab-btn" data-view="view-history">
        <span class="tab-icon">&#128197;</span><span>History</span>
      </button>
      <button class="tab-btn" data-view="view-manage">
        <span class="tab-icon">&#9881;</span><span>Manage</span>
      </button>
    </nav>
  </div>

  <!-- Add/Edit Medication Modal -->
  <div id="med-modal" class="modal-overlay">
    <div class="modal">
      <h2 id="med-modal-title">Add Medication</h2>
      <form id="med-form">
        <label class="field">
          <span>Name</span>
          <input type="text" id="med-name" placeholder="e.g. Atorvastatin" required maxlength="80">
        </label>
        <label class="field">
          <span>Dosage <em>(optional)</em></span>
          <input type="text" id="med-dosage" placeholder="e.g. 2 tablets, 20 mg" maxlength="80">
        </label>
        <label class="field">
          <span>Instructions <em>(optional)</em></span>
          <input type="text" id="med-instructions" placeholder="e.g. Take with food" maxlength="120">
        </label>
        <div class="field">
          <span>Schedule</span>
          <div id="schedule-rows"></div>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-add-time">+ Add time</button>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btn-cancel-med">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Day Detail Modal (tap a history cell) -->
  <div id="day-modal" class="modal-overlay">
    <div class="modal">
      <h2 id="day-modal-title">Doses</h2>
      <div id="day-modal-list"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary btn-block" id="btn-close-day">Done</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
